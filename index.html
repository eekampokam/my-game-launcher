
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>ADEPTA: STRIPPED</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }

    .label {
      color: #999;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 28px;
      font-size: clamp(32px, 8vw, 64px);
      letter-spacing: -2px;
    }

    .game {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      margin-top: 22px;
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .fallback {
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }

    a { color: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="label">A browser game</div>
    <h1>ADEPTA: STRIPPED</h1>

    <div class="game">
      <iframe
        src="https://itch.io/embed-upload/19972671?color=333333"
        allowfullscreen
        allow="autoplay; fullscreen; gamepad"
        title="ADEPTA: STRIPPED">
      </iframe>
    </div>

    <div class="fallback">
      Having trouble? <a href="https://studiohitenma.itch.io/adepta-stripped">Play on itch.io</a>
    </div>

    <footer>NO DOWNLOAD REQUIRED</footer>
  </main>
</body>
</html>
