
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>ADEPTA: STRIPPED</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 26px 10px 20px;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .label {
      color: #999;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 24px;
      font-size: clamp(30px, 7vw, 64px);
      line-height: 1.05;
      letter-spacing: -1.5px;
    }

    .game {
      width: 100%;
      height: 78vh;
      height: 78dvh;
      min-height: 500px;
      max-height: 1000px;
      background: #000;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .fallback {
      margin-top: 18px;
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
    }

    .fallback a {
      color: #fff;
    }

    footer {
      margin-top: 24px;
      padding-bottom: 12px;
      color: #666;
      font-size: 10px;
      letter-spacing: 3px;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 0 12px;
      }

      .label {
        font-size: 10px;
      }

      h1 {
        padding: 0 8px;
        margin: 16px 0 20px;
        font-size: clamp(28px, 8vw, 42px);
      }

      .game {
        height: 82vh;
        height: 82dvh;
        min-height: 520px;
        max-height: none;
      }

      .fallback {
        padding: 0 12px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="label">A Browser Game</div>

    <h1>ADEPTA: STRIPPED</h1>

    <div class="game">
      <iframe
        src="https://itch.io/embed-upload/19972671?color=333333"
        title="ADEPTA: STRIPPED"
        allow="autoplay; fullscreen; gamepad; speaker-selection"
        allowfullscreen>
      </iframe>
    </div>

    <div class="fallback">
      Having trouble?
      <a href="https://studiohitenma.itch.io/adepta-stripped">
        Play on itch.io
      </a>
    </div>

    <footer>NO DOWNLOAD REQUIRED</footer>
  </main>
</body>
</html>
